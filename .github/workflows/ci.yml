name: CI

on:
  push:
    branches: [main, "develop/**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: data-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: data-dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint . --max-warnings 0
      - run: npx vitest run
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: databridge-ui
          path: data-dashboard/dist
          if-no-files-found: error
